name: Feature request
description: Suggest a connector, a tool or a change to how Palui behaves.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or the situation, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Palui to do
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
