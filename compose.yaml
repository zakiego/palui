# Production compose file. Deploy with `docker compose up -d --build --wait`,
# which waits on the healthcheck, so it must be cheap and honest.
# One service: `palui serve` is the server, the dashboard and the runtime.
# Secrets come from .env (MASTER_KEY, APP_URL; BETTER_AUTH_SECRET is no longer
# read); every other credential is encrypted in the database. The image sets
# NODE_ENV=production, HOST, PORT=3000, DATA_DIR=/data and PALUI_BUILD_INFO.
name: palui

x-logging: &logging           # caps logs at 30 MB per container
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  app:                        # keep this name, deploy scripts look for it
    build: .
    image: palui:latest       # one tag, overwritten on every deploy
    restart: unless-stopped
    ports:
      - "127.0.0.1:4802:3000" # loopback only, the tunnel is the only way in
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    extra_hosts:
      # services on the host: model proxy, memory, host bridge (:4893)
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data
    healthcheck:              # the binary itself, no shell or Node. /health fails only when the DB is newer than the code
      test: ["CMD", "palui", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
    stop_grace_period: 60s    # drains on SIGTERM: finish the current step, release outbox claims (hard exit at 58 s)
    logging: *logging

volumes:
  data:
